name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gurusthalam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gurusthalam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gurusthalam?schema=public
      DATABASE_NAME: gurusthalam
      REDIS_URL: redis://localhost:6379
      INTERNAL_API_KEY: ci-test-internal-api-key
      NOTIFICATION_PROVIDER_FAILURE_MODE: disabled
      NOTIFICATION_PROVIDER_RETRY_AFTER_MS: 10000
      NOTIFICATION_PROVIDER_FAILURE_CODE: SIMULATED_PROVIDER_FAILURE

    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Setup pnpm used by this repository
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      # Setup Node.js and cache the pnpm store
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      # Install the exact dependency graph from the committed lockfile
      - run: pnpm install --frozen-lockfile

      # Provide the runtime env file required by the API Nx serve target.
      # This file exists only inside the ephemeral CI runner.
      - name: Create API CI environment file
        run: |
          cat > apps/api/.env <<'EOF'
          NODE_ENV=test
          PORT=3000
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/gurusthalam?schema=public
          DATABASE_NAME=gurusthalam
          REDIS_URL=redis://localhost:6379
          INTERNAL_API_KEY=ci-test-internal-api-key
          EOF

      # Apply the committed Prisma migrations to the ephemeral CI database
      - name: Apply database migrations
        run: pnpm --filter @org/api exec prisma migrate deploy --config prisma.config.ts

      # Validate formatting
      - run: pnpm exec nx format:check --base="remotes/origin/main"

      # Run the complete Nx CI validation suite
      - run: pnpm exec nx run-many -t lint test build typecheck e2e
