name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Setup pnpm used by this repository
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      # Setup Node.js and cache the pnpm store
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      # Install the exact dependency graph from the committed lockfile
      - run: pnpm install --frozen-lockfile

      # Validate formatting
      - run: pnpm exec nx format:check --base="remotes/origin/main"

      # Run the complete Nx CI validation suite
      - run: pnpm exec nx run-many -t lint test build typecheck e2e
